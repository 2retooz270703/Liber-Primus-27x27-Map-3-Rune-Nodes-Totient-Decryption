name: Auto-update animated plaintext banner

on:
  push:
    branches: [main]
    paths:
      - 'plaintext-i-found/**'
      - 'assets/example.gif'
      - 'example.gif'
      - '.github/workflows/auto-plaintext.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate animated plaintext banner
        shell: bash
        run: |
          python - <<'PY'
          import math
          import re
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps, ImageFilter

          folder = Path('plaintext-i-found')
          stages = []

          for f in folder.iterdir():
              if not f.is_file():
                  continue
              match = re.fullmatch(r'(\d+)-(.+)\.md', f.name, re.IGNORECASE)
              if match:
                  stages.append((
                      int(match.group(1)),
                      match.group(2).replace('-', ' ')
                  ))

          if not stages:
              raise SystemExit('No numbered plaintext files found.')

          stages.sort()

          if len({n for n, _ in stages}) != len(stages):
              raise SystemExit('Duplicate plaintext stage numbers.')

          plaintext = ' '.join(words for _, words in stages)

          source = next(
              (
                  p for p in (
                      Path('assets/example.gif'),
                      Path('example.gif')
                  )
                  if p.is_file()
              ),
              None
          )

          if source is None:
              raise SystemExit('Missing example.gif')

          # Banner dimensions and typography
          W = 1100
          FONT_SIZE = 34
          LINE_HEIGHT = 52
          PADDING_X = 85
          PADDING_Y = 72
          MIN_H = 290
          RADIUS = 28

          font = ImageFont.truetype(
              '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',
              FONT_SIZE
          )

          measure = ImageDraw.Draw(
              Image.new('RGB', (1, 1))
          )

          limit = W - 2 * PADDING_X
          words = plaintext.split()

          # Initial line wrapping
          lines = []
          line = ''

          for word in words:
              candidate = f'{line} {word}'.strip()

              if measure.textlength(candidate, font=font) <= limit:
                  line = candidate
                  continue

              if line:
                  lines.append(line)
                  line = ''

              while word and measure.textlength(word, font=font) > limit:
                  cut = 1

                  while (
                      cut < len(word)
                      and measure.textlength(
                          word[:cut + 1], font=font
                      ) <= limit
                  ):
                      cut += 1

                  lines.append(word[:cut])
                  word = word[cut:]

              line = word

          if line:
              lines.append(line)

          # Balance lines to avoid very short final lines
          if (
              len(words) <= 160
              and all(
                  measure.textlength(w, font=font) <= limit
                  for w in words
              )
          ):
              from functools import lru_cache

              n_lines = len(lines)
              target_width = (
                  measure.textlength(plaintext, font=font) / n_lines
              )

              @lru_cache(None)
              def balanced(i, remaining):
                  if remaining == 0:
                      if i == len(words):
                          return (0.0, ())
                      return (float('inf'), ())

                  best = (float('inf'), ())

                  for j in range(
                      i + 1,
                      len(words) - remaining + 2
                  ):
                      part = ' '.join(words[i:j])
                      actual = measure.textlength(
                          part, font=font
                      )

                      if actual > limit:
                          break

                      next_cost, next_parts = balanced(
                          j, remaining - 1
                      )

                      cost = (
                          (actual - target_width) ** 2
                          + next_cost
                      )

                      if cost < best[0]:
                          best = (
                              cost,
                              (part,) + next_parts
                          )

                  return best

              cost, sections = balanced(0, n_lines)

              if sections:
                  lines = list(sections)

          # Height grows with plaintext
          H = max(
              MIN_H,
              len(lines) * LINE_HEIGHT + 2 * PADDING_Y
          )

          # Rounded transparent corners
          mask = Image.new('L', (W, H))

          ImageDraw.Draw(mask).rounded_rectangle(
              (0, 0, W - 1, H - 1),
              radius=RADIUS,
              fill=255
          )

          outside = mask.point(
              lambda v: 0 if v >= 128 else 255
          )

          frames = []
          durations = []

          with Image.open(source) as gif:
              count = getattr(gif, 'n_frames', 1)

              # Reduce frame count for large banners
              frame_budget = max(
                  24,
                  min(90, round(90 * 500 / H))
              )

              step = max(
                  1,
                  math.ceil(count / frame_budget)
              )

              for i in range(count):
                  gif.seek(i)

                  ms = max(
                      20,
                      int(gif.info.get('duration', 100) or 100)
                  )

                  if i % step != 0:
                      durations[-1] += ms
                      continue

                  durations.append(ms)

                  frame = gif.convert('RGB')

                  # Scale background without distortion
                  bg = ImageOps.fit(
                      frame,
                      (W, H),
                      method=Image.Resampling.LANCZOS
                  )

                  bg = bg.filter(
                      ImageFilter.GaussianBlur(3)
                  )

                  base = bg.convert('RGBA')

                  # Preserve some full-map context for tall banners
                  if H > 550:
                      whole = ImageOps.contain(
                          frame,
                          (W, H),
                          method=Image.Resampling.LANCZOS
                      ).convert('RGBA')

                      whole.putalpha(48)

                      base.alpha_composite(
                          whole,
                          (
                              (W - whole.width) // 2,
                              (H - whole.height) // 2
                          )
                      )

                  # Dark overlay
                  base = Image.alpha_composite(
                      base,
                      Image.new(
                          'RGBA',
                          (W, H),
                          (20, 12, 37, 165)
                      )
                  )

                  draw = ImageDraw.Draw(base)

                  # Border
                  draw.rounded_rectangle(
                      (2, 2, W - 3, H - 3),
                      radius=RADIUS - 2,
                      outline=(217, 201, 255, 140),
                      width=2
                  )

                  # Vertically centered plaintext
                  top = (
                      H - len(lines) * LINE_HEIGHT
                  ) // 2

                  for j, row in enumerate(lines):
                      draw.text(
                          (
                              W // 2,
                              top + j * LINE_HEIGHT
                              + LINE_HEIGHT // 2
                          ),
                          row,
                          font=font,
                          anchor='mm',
                          fill='white',
                          stroke_width=2,
                          stroke_fill=(20, 14, 36, 255)
                      )

                  rgb = base.convert('RGB')

                  # Consistent colors across GIF frames
                  if not frames:
                      palette_ref = rgb.quantize(
                          colors=255,
                          method=Image.Quantize.MEDIANCUT
                      )

                  paletted = rgb.quantize(
                      palette=palette_ref,
                      dither=Image.Dither.NONE
                  )

                  paletted.paste(
                      255,
                      (0, 0, W, H),
                      outside
                  )

                  frames.append(paletted)

          # Save animated GIF
          target = Path('assets/plaintext-banner.gif')
          target.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          frames[0].save(
              target,
              format='GIF',
              save_all=True,
              append_images=frames[1:],
              duration=durations,
              loop=0,
              disposal=2,
              transparency=255,
              optimize=False
          )

          # Update README
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')

          start = '<!-- AUTO-PLAINTEXT:START -->'
          end = '<!-- AUTO-PLAINTEXT:END -->'

          block = (
              f'{start}\n'
              '<p align="center">\n'
              '  <a href="./plaintext-i-found/">\n'
              '    <img src="./assets/plaintext-banner.gif" '
              'width="900" alt="Plaintext found in the 27x27 matrix">\n'
              '  </a>\n'
              '</p>\n'
              f'{end}'
          )

          if start in text and end in text:
              text = re.sub(
                  re.escape(start) + r'.*?' + re.escape(end),
                  lambda _: block,
                  text,
                  flags=re.S
              )

          elif start in text or end in text:
              raise SystemExit(
                  'README has only one AUTO-PLAINTEXT marker.'
              )

          elif '## Live Route Analysis' in text:
              text = text.replace(
                  '## Live Route Analysis',
                  block + '\n\n## Live Route Analysis',
                  1
              )

          else:
              text = block + '\n\n' + text

          readme.write_text(
              text,
              encoding='utf-8'
          )

          print(
              f'Generated {len(frames)} frames, '
              f'{len(lines)} lines, size {W}x{H}'
          )
          PY

      - name: Commit updated banner
        shell: bash
        run: |
          git add README.md assets/plaintext-banner.gif

          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git commit -m 'Update animated plaintext banner'
          git push
